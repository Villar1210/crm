name: Deploy → VPS Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run build
        env:
          VITE_API_URL: https://ivillar.com.br/api

      - name: Instalar dependências do backend
        run: npm install
        working-directory: ./server

      - name: Compilar TypeScript do backend
        run: npm run build
        working-directory: ./server

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "=== Iniciando deploy ==="

            # Frontend
            cd /var/www/ivillar.com.br
            echo "→ Atualizando código frontend..."
            git fetch origin main
            git reset --hard origin/main

            # Backend
            cd /var/www/crm
            echo "→ Atualizando backend..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Instalando dependências do backend..."
            cd /var/www/crm/server
            npm install --production

            echo "→ Compilando TypeScript..."
            npm run build

            echo "→ Rodando migrations do banco..."
            npx prisma migrate deploy

            echo "→ Reiniciando processos PM2..."
            pm2 restart ivillar-crm
            pm2 restart crm-backend
            pm2 save

            echo "=== Deploy concluído com sucesso! ==="

      - name: Status do deploy
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy realizado com sucesso em $(date '+%d/%m/%Y %H:%M')"
          else
            echo "❌ Deploy falhou — verifique os logs acima"
          fi
