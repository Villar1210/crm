name: Deploy → VPS Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          connect_timeout: 60s
          script: |
            set -e
            echo "=== Iniciando deploy ==="

            # ── Frontend ──────────────────────────────────────────
            cd /var/www/ivillar.com.br
            echo "→ Atualizando código..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Instalando dependências do frontend..."
            npm install

            echo "→ Buildando frontend..."
            VITE_API_URL=https://ivillar.com.br/api npm run build

            echo "→ Build gerado em: $(ls dist/ | head -5)"

            # ── Backend ───────────────────────────────────────────
            cd /var/www/crm
            echo "→ Atualizando backend..."
            git fetch origin main
            git reset --hard origin/main

            cd /var/www/crm/server
            echo "→ Instalando dependências do backend..."
            npm install

            echo "→ Gerando Prisma Client..."
            npx prisma generate

            echo "→ Aplicando migrations de segurança..."
            node scripts/migrate-security.js

            echo "→ Compilando TypeScript..."
            npm run build

            # ── Reiniciar serviços ────────────────────────────────
            echo "→ Reiniciando PM2..."
            pm2 restart ivillar-crm
            pm2 restart crm-backend
            pm2 save

            echo "→ Recarregando Nginx..."
            systemctl reload nginx

            echo "=== Deploy concluído! ==="
            echo "Acesse: https://ivillar.com.br/admin/security"

      - name: Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy OK em $(date '+%d/%m/%Y %H:%M')"
          else
            echo "❌ Deploy falhou"
          fi
